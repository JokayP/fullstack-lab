spring.application.name=products-crud
server.address=127.0.0.1
server.port=${PORT:8080}

# PostgreSQL is the primary database. Environment variables override the connection.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/products_db}
spring.datasource.username=${DB_USER:student}
spring.datasource.password=${DB_PASSWORD:local_class_2026}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=false
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# Do not silently convert stock=1.5 to stock=1.
spring.jackson.deserialization.accept-float-as-int=false
spring.jackson.deserialization.fail-on-unknown-properties=true
app.seed=true
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000,http://127.0.0.1:3000}
