services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: products_db
      POSTGRES_USER: student
      POSTGRES_PASSWORD: local_class_2026
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - products_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U student -d products_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  products_data:
