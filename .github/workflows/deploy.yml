name: Build release and deploy to EC2

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ec2-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Verify and package release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source code
        uses: actions/checkout@v6
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Check deployment scripts
        run: |
          for script in deploy/ec2/{update,github-deploy,github-deploy-alb,enable-private-database,export-app-node,install-app-node}.sh; do
            bash -n "$script"
          done
          shellcheck deploy/ec2/{update,github-deploy,github-deploy-alb,enable-private-database,export-app-node,install-app-node}.sh tests/deployment-*.test.sh
          bash tests/deployment-release.test.sh
          bash tests/deployment-alb.test.sh
      - name: Verify backend
        run: bash ./mvnw --batch-mode --no-transfer-progress clean verify
      - name: Verify frontends
        run: |
          npm ci
          npm run verify
      - name: Build frontends for the EC2 web server
        env:
          VITE_PRODUCTS_API_URL: /api/products
        run: npm run build
      - name: Package the verified application
        run: |
          mkdir -p target/ec2-bundle/release/www/characters
          cp target/products-crud-1.0.0.jar target/ec2-bundle/release/app.jar
          cp -a apps/storefront/dist/. target/ec2-bundle/release/www/
          cp -a apps/character-explorer/dist/. target/ec2-bundle/release/www/characters/
          printf '%s\n' "$GITHUB_SHA" > target/ec2-bundle/release/www/release.txt
          bash deploy/ec2/update.sh --validate-only target/ec2-bundle/release
          tar -czf target/ec2-bundle/bundle.tar.gz -C target/ec2-bundle release
          (cd target/ec2-bundle && sha256sum bundle.tar.gz > bundle.sha256)
          cp deploy/ec2/update.sh target/ec2-bundle/update.sh
      - name: Save release bundle
        uses: actions/upload-artifact@v4
        with:
          name: ec2-release-${{ github.sha }}
          path: |
            target/ec2-bundle/bundle.tar.gz
            target/ec2-bundle/bundle.sha256
            target/ec2-bundle/update.sh
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy verified release
    needs: release
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: production
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      AWS_DEFAULT_REGION: ${{ vars.AWS_REGION }}
      AWS_PAGER: ''
      EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
      EC2_SECURITY_GROUP_ID: ${{ vars.EC2_SECURITY_GROUP_ID }}
      EC2_SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
      EC2_SSH_HOST_KEY: ${{ vars.EC2_SSH_HOST_KEY }}
      EC2_SECONDARY_INSTANCE_ID: ${{ vars.EC2_SECONDARY_INSTANCE_ID }}
      EC2_SECONDARY_SECURITY_GROUP_ID: ${{ vars.EC2_SECONDARY_SECURITY_GROUP_ID }}
      EC2_SECONDARY_SSH_HOST_KEY: ${{ vars.EC2_SECONDARY_SSH_HOST_KEY }}
      ALB_TARGET_GROUP_ARN: ${{ vars.ALB_TARGET_GROUP_ARN }}
      ALB_DNS_NAME: ${{ vars.ALB_DNS_NAME }}
    steps:
      - name: Check out deployment tools
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Download the verified release
        uses: actions/download-artifact@v4
        with:
          name: ec2-release-${{ github.sha }}
          path: target/ec2-bundle
      - name: Deploy to both ALB targets sequentially
        run: bash deploy/ec2/github-deploy-alb.sh target/ec2-bundle
      - name: Restore target registration and remove temporary SSH access
        if: always()
        run: bash deploy/ec2/github-deploy-alb.sh --cleanup
