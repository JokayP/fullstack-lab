name: Build and test Spring Boot

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source code
        uses: actions/checkout@v6
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compile, test and package
        run: bash ./mvnw --batch-mode --no-transfer-progress clean verify
      - name: Upload executable JAR
        uses: actions/upload-artifact@v4
        with:
          name: products-crud-jar
          path: target/products-crud-1.0.0.jar
          if-no-files-found: error
